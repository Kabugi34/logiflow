<section class="space-y-5">
  <header class="border-b border-slate-200 pb-4">
    <nav aria-label="Breadcrumb" class="mb-2 flex items-center gap-2 text-xs text-slate-400">
      <a routerLink="/distributor/dashboard" queryParamsHandling="preserve" class="hover:text-blue-600">LogiFlow</a>
      <span aria-hidden="true">›</span>
      <span>Distributor</span>
      <span aria-hidden="true">›</span>
      <a routerLink="/distributor/catalog" queryParamsHandling="preserve" class="hover:text-blue-600">Catalog</a>
      <span aria-hidden="true">›</span>
      <span class="font-medium text-slate-600">New Offer</span>
    </nav>

    <h1 class="text-xl font-semibold text-slate-900">Add Listing Offer</h1>
    <p class="mt-1 text-sm text-slate-500">
      Choose a manufacturer product and set your distributor pricing for resale.
    </p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="rounded-lg border border-slate-200 bg-white p-5">
    @if (errorMessage()) {
      <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-700">
        {{ errorMessage() }}
      </div>
    }

    <div class="grid gap-4 md:grid-cols-2">
      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">Manufacturer product</span>
        <select
          [value]="form.controls.sku.value"
          (change)="updateSelectedProduct($event)"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
        >
          <option value="">Select a product</option>
          @for (product of availableProducts(); track product.sku) {
            <option [value]="product.sku">{{ product.name }} · {{ product.sku }}</option>
          }
        </select>
      </label>

      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">Manufacturer</span>
        <input
          formControlName="manufacturerName"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
          readonly
        >
      </label>

      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">SKU</span>
        <input
          formControlName="sku"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
          readonly
        >
      </label>

      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">Product name</span>
        <input
          formControlName="productName"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
          readonly
        >
      </label>

      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">Category</span>
        <input
          formControlName="category"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
          readonly
        >
      </label>

      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">Brand</span>
        <input
          formControlName="brand"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
          readonly
        >
      </label>

      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">Listing price</span>
        <input
          type="number"
          min="0.01"
          step="0.01"
          formControlName="listPrice"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
        >
      </label>

      <label class="block text-xs font-medium text-slate-700">
        <span class="mb-1.5 block">Minimum order qty</span>
        <input
          type="number"
          min="1"
          step="1"
          formControlName="minimumOrderQty"
          class="h-10 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none focus:border-blue-400"
        >
      </label>

      <label class="block text-xs font-medium text-slate-700 md:col-span-2">
        <span class="mb-1.5 block">Offer notes</span>
        <textarea
          rows="4"
          formControlName="notes"
          class="w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-xs text-slate-700 outline-none focus:border-blue-400"
          placeholder="Add margin notes, lead times, or availability details..."
        ></textarea>
      </label>
    </div>

    <div class="mt-6 flex items-center justify-end gap-3">
      <a routerLink="/distributor/catalog" queryParamsHandling="preserve" class="text-xs font-medium text-slate-600 hover:text-slate-800">
        Cancel
      </a>
      <button type="submit" class="inline-flex h-10 items-center rounded-md bg-blue-600 px-4 text-xs font-medium text-white hover:bg-blue-700">
        Save offer
      </button>
    </div>
  </form>
</section>
