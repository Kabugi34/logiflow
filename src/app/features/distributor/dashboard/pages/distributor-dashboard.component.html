<section class="space-y-5">
  <header class="border-b border-slate-200 pb-4">
    <nav aria-label="Breadcrumb" class="mb-2 flex items-center gap-2 text-xs text-slate-400">
      <span>LogiFlow</span><span aria-hidden="true">›</span><span>Distributor</span><span aria-hidden="true">›</span><span class="font-medium text-slate-600">Dashboard</span>
    </nav>
    <h1 class="text-xl font-semibold text-slate-900">Distributor Command Center</h1>
    <p class="mt-1 text-sm text-slate-500">Consolidated overview of B2B client demands, inventory control, and fleet status.</p>
  </header>

  <app-distributor-dashboard-statistics [dashboard]="dashboard" />

  <div class="grid grid-cols-1 items-start gap-4 2xl:grid-cols-[1.55fr_1fr]">
    <div class="space-y-4">
      <app-active-customer-orders [orders]="activeOrders()" />
      <app-critical-stock [alerts]="stockAlerts()" />
    </div>

    <aside class="space-y-4">
      <section class="rounded-lg border border-slate-200 bg-white p-4">
        <h2 class="text-sm font-semibold text-slate-900">Distributor Pipelines</h2>
        <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
          <a routerLink="/distributor/orders/new" queryParamsHandling="preserve" class="rounded-md bg-blue-600 px-3 py-2 text-center text-xs font-medium text-white hover:bg-blue-700">+ Create Client Order</a>
          <a routerLink="/distributor/orders" queryParamsHandling="preserve" class="rounded-md border border-slate-200 px-3 py-2 text-center text-xs font-medium text-slate-700 hover:bg-slate-50">Review Order Queue</a>
        </div>
      </section>
      <app-distributor-fleet-map [vehicles]="vehicles()" />
      <app-distributor-fleet-overview [drivers]="drivers()" />
    </aside>
  </div>
</section>
