<section class="overflow-hidden rounded-lg border border-slate-200 bg-white">
  <h2 class="border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900">Route Geofence Visualizer</h2>
  @if (shipment().status === 'UNKNOWN') {
    <p class="px-4 py-8 text-center text-xs text-slate-500">Route progress is unavailable until the shipment status is confirmed.</p>
  } @else {
    <app-logistics-route-map [route]="route()" [currentIndex]="currentIndex()" routeLabel="Manufacturer shipment route" />
    <div class="flex flex-wrap gap-x-4 gap-y-1 border-t border-slate-100 px-4 py-2 text-[10px] text-slate-500"><span>Origin: {{ shipment().origin }}</span><span>Destination: {{ shipment().destinationFacility }}</span></div>
  }
</section>
