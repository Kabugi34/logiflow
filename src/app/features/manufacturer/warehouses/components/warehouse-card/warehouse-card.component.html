<button type="button" (click)="selectWarehouse.emit(warehouse().id)" [attr.aria-pressed]="selected()" class="w-full rounded-lg border bg-white p-4 text-left transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600" [class.border-blue-600]="selected()" [class.border-slate-200]="!selected()" [class.ring-1]="selected()" [class.ring-blue-600]="selected()">
  <div class="flex items-start justify-between gap-3"><h2 class="text-sm font-semibold text-slate-900">{{ warehouse().name }}</h2><span class="rounded border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[9px] font-medium text-emerald-700">{{ warehouse().status }}</span></div>
  <p class="mt-2 text-xs text-slate-500">{{ warehouse().address }}, {{ warehouse().city }}, {{ warehouse().postalCode }}</p>
  <div class="mt-4 grid grid-cols-2 gap-3 border-t border-slate-100 pt-3 text-[10px]"><div><p class="text-slate-400">Current Stock Hold</p><p class="mt-1 text-xs font-semibold text-slate-800">{{ warehouse().stockUnits | number }} Units</p></div><div class="text-right"><p class="text-slate-400">Active Operators</p><p class="mt-1 text-xs font-semibold text-slate-800">{{ warehouse().staffCount }} Staff</p></div></div>
</button>
