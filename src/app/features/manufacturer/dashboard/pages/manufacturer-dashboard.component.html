<section class="space-y-5">
  <header class="border-b border-slate-200 pb-4">
    <nav aria-label="Breadcrumb" class="mb-2 flex items-center gap-2 text-xs text-slate-400">
      <span>LogiFlow</span><span aria-hidden="true">›</span><span class="text-slate-500">Dashboard</span>
    </nav>
    <h1 class="text-xl font-semibold text-slate-900">Manufacturer Control Center</h1>
    <p class="mt-1 text-sm text-slate-500">Real-time multi-warehouse overview and dispatch pipelines.</p>
  </header>

  <app-dashboard-statistics [dashboard]="dashboard" />

  <div class="grid grid-cols-1 items-start gap-4 2xl:grid-cols-[1.55fr_1fr]">
    <div class="space-y-4">
      <app-pending-purchase-orders [purchaseOrders]="purchaseOrders" />
      <app-active-shipments [shipments]="shipments" />
    </div>

    <aside class="space-y-4">
      <section class="rounded-lg border border-slate-200 bg-white p-4">
        <h2 class="text-sm font-semibold text-slate-900">Operations Quick Actions</h2>
        <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
          <a routerLink="/manufacturer/products/new" queryParamsHandling="preserve" class="rounded-md bg-blue-600 px-3 py-2 text-center text-xs font-medium text-white hover:bg-blue-700">+ Add New Product</a>
          <a routerLink="/manufacturer/shipments" queryParamsHandling="preserve" class="rounded-md border border-slate-200 px-3 py-2 text-center text-xs font-medium text-slate-700 hover:bg-slate-50">Schedule Dispatch</a>
        </div>
      </section>
      <app-fleet-overview [dashboard]="dashboard" [drivers]="drivers" />
      <app-live-fleet-map [drivers]="drivers" />
      <app-attention-panel [items]="attentionItems" />
    </aside>
  </div>
</section>
