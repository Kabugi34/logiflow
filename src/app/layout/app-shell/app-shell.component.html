<div class="flex h-dvh overflow-hidden bg-slate-50">
  <app-sidebar [workspace]="workspace" />

  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar [searchPlaceholder]="workspace.searchPlaceholder" />

    @if (httpActivity.busy()) {
      <div class="h-0.5 w-full overflow-hidden bg-blue-100" role="status" aria-label="Loading">
        <div class="h-full w-1/3 animate-pulse rounded-full bg-blue-600"></div>
        <span class="sr-only">Loading data</span>
      </div>
    }

    <main class="min-h-0 min-w-0 flex-1 overflow-y-auto p-3 sm:p-5 lg:p-6">
      <router-outlet />
    </main>
  </div>
</div>
