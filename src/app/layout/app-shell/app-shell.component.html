<div class="flex h-screen overflow-hidden bg-slate-50">

  @if (layout.isSidebarOpen()) {
    <app-sidebar id="app-sidebar" [workspace]="workspace" />
  }

  <div class="flex min-w-0 flex-1 flex-col">

    <app-topbar [searchPlaceholder]="workspace.searchPlaceholder" />

    <main class="min-h-0 flex-1 overflow-y-auto p-3 sm:p-5 lg:p-6">
      <router-outlet />
    </main>

  </div>

</div>
