<header class="flex h-16 items-center justify-end gap-2 border-b border-slate-200 bg-white px-3 sm:gap-3 sm:px-5 lg:px-6">
  <label class="relative w-full max-w-64">
    <span class="sr-only">Universal lookup</span>
    <span aria-hidden="true" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">⌕</span>
    <input
      type="search"
      placeholder="Universal lookup (PO, SKU, Driver)..."
      class="h-9 w-full rounded-md border border-slate-200 bg-slate-50 pl-8 pr-3 text-xs text-slate-700 outline-none placeholder:text-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100">
  </label>
  <button type="button" aria-label="Notifications" title="Notifications" class="grid h-9 w-9 shrink-0 place-items-center rounded-md border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">
    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />

  </button>
